
<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Professional Bank Management System V2.0</title>

  <!-- Google Fonts & Styles -->
  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Lucide Icons & SweetAlert2 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 40%), var(--bg-primary);">

  <div class="glass-panel" style="width: 100%; max-width: 420px; padding: 2.5rem 2rem;">
    <!-- Logo Header -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="sidebar-brand-icon" style="margin: 0 auto 1rem; width: 48px; height: 48px; font-size: 1.25rem;">
        <i data-lucide="landmark"></i>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 800; letter-spacing: -0.02em;">Bank Core Admin</h2>
      <p class="text-secondary text-xs" style="margin-top: 0.25rem;">Sistem Manajemen Data Bank Enterprise V2.0</p>
    </div>

    <!-- Login Form -->
    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input type="text" id="username" class="form-input" placeholder="Masukkan username" required autocomplete="username">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" id="remember-me" style="accent-color: var(--accent-primary);"> Remember me
        </label>
        <button type="button" class="btn btn-outline btn-xs" onclick="showSettingsModal()">Config API</button>
      </div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
        <span>Masuk ke Dashboard</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </form>

    <!-- Preset Demo Accounts -->
    <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
      <p class="text-muted text-xs" style="text-align: center; margin-bottom: 0.75rem;">Akses Cepat (Demo Preset):</p>
      <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem;">
        <button type="button" class="btn btn-outline btn-xs" onclick="fillPreset('leader', 'admin123')">Leader</button>
        <button type="button" class="btn btn-outline btn-xs" onclick="fillPreset('kapten', 'kapten123')">Kapten</button>
        <button type="button" class="btn btn-outline btn-xs" onclick="fillPreset('cs_staff', 'cs123456')">CS</button>
        <button type="button" class="btn btn-outline btn-xs" onclick="fillPreset('kasir_staff', 'kasir123')">Kasir</button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      if (AuthService.isAuthenticated()) {
        window.location.href = 'dashboard.html';
        return;
      }

      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();

        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const btn = document.getElementById('btn-submit-login');

        btn.disabled = true;
        btn.innerHTML = `<span>Memproses...</span>`;

        try {
          const res = await ApiService.login(u, p);
          if (res.status === 'success') {
            AuthService.setSession(res.token, res.user);
            Swal.fire({
              icon: 'success',
              title: 'Login Berhasil',
              text: `Selamat datang kembali, ${res.user.username}!`,
              timer: 1500,
              showConfirmButton: false
            }).then(() => {
              window.location.href = 'dashboard.html';
            });
          } else {
            Swal.fire('Gagal Login', res.message || 'Periksa kembali username dan password.', 'error');
            btn.disabled = false;
            btn.innerHTML = `<span>Masuk ke Dashboard</span><i data-lucide="arrow-right"></i>`;
            lucide.createIcons();
          }
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = `<span>Masuk ke Dashboard</span><i data-lucide="arrow-right"></i>`;
          lucide.createIcons();
        }
      });
    });

    function fillPreset(username, password) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
    }

    function showSettingsModal() {
      Swal.fire({
        title: 'Pengaturan REST API',
        html: `
          <p class="text-xs text-muted mb-3">Masukkan Web App Deployment URL Google Apps Script Anda:</p>
          <input id="swal-input-url" class="swal2-input" placeholder="https://script.google.com/macros/s/.../exec" value="${CONFIG.API_URL}">
        `,
        showCancelButton: true,
        confirmButtonText: 'Simpan URL',
        preConfirm: () => {
          const url = document.getElementById('swal-input-url').value.trim();
          if (!url) {
            Swal.showValidationMessage('URL tidak boleh kosong');
          }
          return url;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.setItem('BANK_APP_GAS_URL', result.value);
          CONFIG.API_URL = result.value;
          Swal.fire('Tersimpan', 'URL API berhasil disimpan', 'success');
        }
      });
    }
  </script>
</body>
</html>
