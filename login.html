<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication - Enterprise Bank Core System V2.0</title>

  <link rel="stylesheet" href="assets/css/styles.css">

  <!-- Lucide Icons & SweetAlert2 -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1.5rem; background: radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.12), transparent 50%), radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.08), transparent 45%), var(--bg-primary);">

  <div class="glass-panel" style="width: 100%; max-width: 440px; padding: 2.75rem 2.25rem; position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
    
    <!-- Top Security Glow Accent -->
    <div style="position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--accent-primary), var(--emerald), var(--accent-primary));"></div>

    <!-- Logo & Security Branding -->
    <div style="text-align: center; margin-bottom: 2.25rem;">
      <div class="sidebar-brand-icon" style="margin: 0 auto 1.25rem; width: 56px; height: 56px; font-size: 1.5rem; border-radius: 16px; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);">
        <i data-lucide="shield-check"></i>
      </div>
      <h2 style="font-size: 1.65rem; font-weight: 800; letter-spacing: -0.03em; color: var(--text-primary);">Bank Admin Core</h2>
      <p class="text-secondary text-xs" style="margin-top: 0.35rem; display: flex; align-items: center; justify-content: center; gap: 0.35rem;">
        <i data-lucide="lock" style="width: 12px; height: 12px; color: var(--emerald);"></i>
        <span>256-Bit Encrypted & IP Whitelisted Portal</span>
      </p>
    </div>

    <!-- Login Form -->
    <form id="form-login">
      <div class="form-group">
        <label class="form-label" for="username">Username Pengguna</label>
        <div style="position: relative;">
          <i data-lucide="user" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text-muted);"></i>
          <input type="text" id="username" class="form-input" style="padding-left: 2.5rem;" placeholder="Masukkan username" required autocomplete="username">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label class="form-label" for="password">Password Keamanan</label>
        <div style="position: relative;">
          <i data-lucide="key" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; color: var(--text-muted);"></i>
          <input type="password" id="password" class="form-input" style="padding-left: 2.5rem; padding-right: 2.5rem;" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" onclick="toggleLoginPassword()" style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; padding: 2px;">
            <i data-lucide="eye" id="icon-eye-pass" style="width: 16px;"></i>
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.75rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-secondary); cursor: pointer;">
          <input type="checkbox" id="remember-me" style="accent-color: var(--accent-primary); width: 15px; height: 15px;"> Ingat Sesi Saya
        </label>
        <button type="button" class="btn btn-outline btn-xs" onclick="showSettingsModal()" style="font-size: 0.75rem;">
          <i data-lucide="settings" style="width: 12px;"></i> Config API
        </button>
      </div>

      <button type="submit" id="btn-submit-login" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; border-radius: 12px;">
        <span>Masuk ke System</span>
        <i data-lucide="arrow-right"></i>
      </button>
    </form>

    <!-- IP Badge Footer -->
    <div style="margin-top: 2.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); text-align: center;">
      <div class="text-xs text-muted" style="display: flex; align-items: center; justify-content: center; gap: 0.4rem;">
        <i data-lucide="wifi" style="width: 13px; color: var(--accent-primary);"></i>
        <span>IP Terdeteksi: <b id="ip-display" class="text-mono text-primary">Memeriksa...</b></span>
      </div>
    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    let detectedClientIp = '';
    fetch('https://api.ipify.org?format=json')
      .then(r => r.json())
      .then(d => {
        detectedClientIp = d.ip || '';
        document.getElementById('ip-display').textContent = detectedClientIp || 'IP Terlindungi';
      })
      .catch(() => {
        document.getElementById('ip-display').textContent = 'IP Terlindungi';
      });

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      if (AuthService.isAuthenticated()) {
        window.location.href = 'dashboard.html';
        return;
      }

      document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();

        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value;
        const btn = document.getElementById('btn-submit-login');

        btn.disabled = true;
        btn.innerHTML = `<span>Memverifikasi Keamanan...</span>`;

        try {
          const res = await ApiService.login(u, p, detectedClientIp);
          if (res.status === 'success') {
            AuthService.setSession(res.token, res.user);
            Swal.fire({
              icon: 'success',
              title: 'Otentikasi Berhasil',
              text: `Selamat datang, ${res.user.username}!`,
              timer: 1200,
              showConfirmButton: false
            }).then(() => {
              window.location.href = 'dashboard.html';
            });
          } else {
            Swal.fire('Akses Ditolak', res.message || 'Periksa kembali kredensial Anda.', 'error');
            btn.disabled = false;
            btn.innerHTML = `<span>Masuk ke System</span><i data-lucide="arrow-right"></i>`;
            lucide.createIcons();
          }
        } catch (err) {
          btn.disabled = false;
          btn.innerHTML = `<span>Masuk ke System</span><i data-lucide="arrow-right"></i>`;
          lucide.createIcons();
        }
      });
    });

    function toggleLoginPassword() {
      const el = document.getElementById('password');
      const icon = document.getElementById('icon-eye-pass');
      if (el.type === 'password') {
        el.type = 'text';
      } else {
        el.type = 'password';
      }
    }

    function showSettingsModal() {
      Swal.fire({
        title: 'Pengaturan REST API',
        html: `
          <p class="text-xs text-muted mb-3">Masukkan Web App Deployment URL Google Apps Script Anda:</p>
          <input id="swal-input-url" class="swal2-input" placeholder="https://script.google.com/macros/s/.../exec" value="${CONFIG.API_URL}">
        `,
        showCancelButton: true,
        confirmButtonText: 'Simpan URL',
        preConfirm: () => {
          const url = document.getElementById('swal-input-url').value.trim();
          if (!url) Swal.showValidationMessage('URL tidak boleh kosong');
          return url;
        }
      }).then((result) => {
        if (result.isConfirmed) {
          localStorage.setItem('BANK_APP_GAS_URL', result.value);
          CONFIG.API_URL = result.value;
          Swal.fire('Tersimpan', 'URL API berhasil disimpan', 'success');
        }
      });
    }
  </script>
</body>
</html>
